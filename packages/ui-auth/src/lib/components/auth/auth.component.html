<nb-layout>
	<nb-layout-column class="wrapper">
		<nb-card class="card">
			<nb-card-header class="header" [class.register]="isRegister" [class.login]="isLogin">
				<a class="download-link" href="/downloads/" target="_blank" rel="noopener">
					<nb-icon icon="download-outline"></nb-icon>
					<span>{{ 'USER_MENU.DOWNLOAD_APPS' | translate }}</span>
				</a>
				<gauzy-switch-theme class="theme-switch" [hasText]="false"></gauzy-switch-theme>
			</nb-card-header>
			<nb-card-body class="body" [class.register]="isRegister" [class.login]="isLogin">
				<nb-auth-block class="auth-block">
					<router-outlet></router-outlet>
				</nb-auth-block>
				<!-- <div class="message-us-wrapper">
					<nb-icon icon="message-square-outline"></nb-icon>
				</div> -->
			</nb-card-body>
		</nb-card>
	</nb-layout-column>
</nb-layout>

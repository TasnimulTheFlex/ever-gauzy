<img src="assets/images/logos/base360-logo.svg" alt="" width="20" height="20" />
@if (parts$ | async; as parts) {
	<span class="visually-hidden">{{ parts.label }}</span>
	<span class="ever-id-label" aria-hidden="true">
		@if (parts.before) {
			<span>{{ parts.before }}</span>
		}
		<span class="ever-id-wordmark">Base360 ID</span>
		@if (parts.after) {
			<span>{{ parts.after }}</span>
		}
	</span>
}

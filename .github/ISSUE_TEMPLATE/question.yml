name: Question
description: Ask how to set up, configure or use Base360
title: "[Question] "
labels: ["type: question :question:"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What have you tried?
      description: Optional. Docs, search, or config you have already applied.
    validations:
      required: false

  - type: input
    id: context
    attributes:
      label: Setup
      description: Optional. Deployment type, app version, or relevant config.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        For setup help, contact [Base360 support](mailto:support@base360.ai).

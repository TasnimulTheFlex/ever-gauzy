<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Base360 Timer</title>
		<base href="/" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/x-icon" href="favicon.ico" />
	</head>
	<body>
		<gauzy-root></gauzy-root>
		<style>
			/* Base360 startup loader: the logo breathes over a sliding bar in the logo's blues */
			.spinner {
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				z-index: 1003;
				background: #ffffff;
				overflow: hidden;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 28px;
			}
			.spinner .b360-logo {
				width: 168px;
				animation: b360-breathe 1.8s ease-in-out infinite;
			}
			.spinner .b360-bar {
				position: relative;
				width: 120px;
				height: 3px;
				border-radius: 3px;
				background: #e8ecff;
				overflow: hidden;
			}
			.spinner .b360-bar::after {
				content: '';
				position: absolute;
				top: 0;
				left: -40%;
				width: 40%;
				height: 100%;
				border-radius: 3px;
				background: linear-gradient(90deg, #9aacfc, #3459fe);
				animation: b360-slide 1.2s ease-in-out infinite;
			}
			@keyframes b360-breathe {
				0%,
				100% {
					opacity: 0.55;
					transform: scale(0.97);
				}
				50% {
					opacity: 1;
					transform: scale(1);
				}
			}
			@keyframes b360-slide {
				0% {
					left: -40%;
				}
				100% {
					left: 100%;
				}
			}
			@media (prefers-reduced-motion: reduce) {
				.spinner .b360-logo,
				.spinner .b360-bar::after {
					animation: none;
				}
			}
		</style>
		<style>
			.woot-widget-bubble,
			.woot--close {
				width: 54px !important;
				height: 54px !important;
				background: #6e49e8 !important;
				border-radius: 16px !important;
				display: flex;
				justify-content: center;
				align-items: center;
				right: 35px !important;
			}
			.woot--close::after,
			.woot--close::before {
				top: auto !important;
				left: auto !important;
			}
			@media screen and (max-width: 790px) {
				.woot--bubble-holder {
					display: none;
				}
			}
		</style>
		<div id="nb-global-spinner" class="spinner" role="progressbar" aria-label="Loading Base360 Timer">
			<img class="b360-logo" src="assets/images/logos/logo_Base360.svg" alt="Base360" />
			<div class="b360-bar"></div>
		</div>
	</body>
</html>
